[project]
name = "sandcastle-liquidator"
version = "0.1.0"
description = "Flash-loan liquidation bot for Sandcastle positions, run from an EOA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "web3>=7.6,<8",
]

[project.optional-dependencies]
hypersync = ["hypersync>=0.8"]

[project.scripts]
sandcastle-liquidator = "sandcastle_liquidator.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcastle_liquidator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF", "PTH", "C4"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# hypersync ships inline annotations without a py.typed marker.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
